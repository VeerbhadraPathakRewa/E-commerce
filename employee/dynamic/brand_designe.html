<div class="row p-4 animate__animated animate__slideInDown">
    <div class=" col-md-4 bg-white shadow-sm p-4">
        <h5>Create Brand</h5>

        <form class="brand-form">
            <select class="form-select mb-3  ">
                <option value="choose category">Chosse Category</option>
            </select>
            <input type="text" placeholder="Brand" class="mb-3 form-control">
            <div class="input-box">
                <div>
                    <i class="fa fa-trash mb-2 float-end"></i>
                    <input type="text" class="form-control mb-3" placeholder="Brand">
                </div>
            </div>
            <button class="btn btn-primary" type="button">
                <i class="fa fa-add"></i>Add Fields
            </button>
            <button class="btn btn-danger">Create</button>
        </form>
    </div>
    <div class="col-md-2"></div>
    <div class="col-md-6 bg-white shadow-sm p-4">
        <h5>Create List</h5>
        <hr>
        <select class="form-select mb-3 cat-list-select ">
            <option value="choose category">Chosse Category</option>
        </select>
        <table class="table fw-bold table-striped">
            <thead>
                <tr>
                    <th>Sr</th>
                    <th>Category</th>
                    <th>Brand</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody class="brand-list">

            </tbody>
        </table>
    </div>
</div>
