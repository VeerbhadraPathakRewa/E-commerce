 
<div class="row p-4 animate__animated animate__slideInDown">
    <div class="col-md-3"></div>
    <div class="col-md-6 bg-white shadow-sm">
        <h2 class="text-center">SET DELEVERY AREA</h2>
        <form class="delevery-form">
            <label for="country">Country</label>
            <select name="" id="country"  class="form-select">
                <option value="choose country">Select Country</option>
            </select>
            <br>
            <label for="state">State</label>
            <select name="" id="state"  class="form-select">
                <option value="choose state">Select State</option>
            </select>
            <br>
            <label for="city">City</label>
            <select name="" id="city"  class="form-select">
                <option value="choose city">Select City</option>
            </select>
            <br>
            <div class="input-group mb-3">
                <span class="input-group-text">Pincode</span>
                <input type="number" class="pincode form-control">
            </div>
            <div class="input-group mb-3">
                <span class="input-group-text code">+xx</span>
                <input type="number" class="form-control">
            </div>
            <div class="input-group mb-3">
                <input type="text" placeholder="Delevery in 5 to 10 dayes"class="form-control">
            </div>
            <label for="pay-mode">Payment Mode</label>
            <select name="" id="pay-mode"  class="form-select">
                <option>All</option>
                <option>Online</option>
            </select>
            <br>
            <button class="btn mb-3 btn-primary float-end form-control">Set Area</button>
        </form>
    </div>
    <div class="col-md-3"></div>
</div>
