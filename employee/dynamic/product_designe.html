<div class="row p-4 animate__animated animate__slideInDown">
    <div class="column-md-1"></div>
    <div class="column-md-10 bg-white shadow-sm p-4">
        <h5>CREATE PRODUCT</h5>
        <form class="product-form">
            <div class="row mb-3">
                <div class="col-md-4">
                    <select class="form-select">
                        <option value="choose category">Choose Category</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <select class="form-select">
                        <option value="choose brand">Choose Brand</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <input type="text" class="form-control" placeholder="Nokia-1900">
                </div>
            </div>
            <textarea rows="10" placeholder="Description" class="form-control mb-3 "></textarea>
            <div class="row mb-3">
                <div class="col-md-6">
                    <input type="text" placeholder="Price" class="form-control">
                </div>
                <div class="col-md-6">
                    <input type="text" placeholder="Quantity" class="form-control">
                </div>
            </div>
            <div class="row">
                <div class="col-md-2 text-center bg-info text-white mx-2 p-2">
                    <input type="file" class="form-control">
                    <i class="fa fa-solid fa-camera-retro" style="font-size: 35px;"></i>
                    <h5>Thumb</h5>
                    <P>250*316</P>
                </div>
                <div class="col-md-2 text-center bg-info text-white mx-2 p-2">
                    <input type="file" class="form-control">
                    <i class="fa fa-solid fa-camera-retro" style="font-size: 35px;"></i>
                    <h5>Front</h5>
                    <P>250*316</P>
                </div>
                <div class="col-md-2 text-center bg-info text-white mx-2 p-2">
                    <input type="file" class="form-control">
                    <i class="fa fa-solid fa-camera-retro" style="font-size: 35px;"></i>
                    <h5>Back</h5>
                    <P>250*316</P>
                </div>
                <div class="col-md-2 text-center bg-info text-white mx-2 p-2">
                    <input type="file" class="form-control">
                    <i class="fa fa-solid fa-camera-retro" style="font-size: 35px;"></i>
                    <h5>Right</h5>
                    <P>250*316</P>
                </div>
                <div class="col-md-2 text-center bg-info text-white mx-2 p-2">
                    <input type="file" class="form-control">
                    <i class="fa fa-solid fa-camera-retro" style="font-size: 35px;"></i>
                    <h5>Left</h5>
                     <P>250*316</P>
                </div>
            </div>
            <button class="btn btn-primary mx-5 mt-2 float-end">Create Product</button>
            <button type="button" class="btn btn-danger mx-5 mt-2 d-none float-end">Update Product</button>
        </form>
    </div>
    <div class="column-md-1"></div>
</div>
<div class="row p-4 animate__animated animate__slideInDown">
    <div class="column-md-1"></div>
    <div class="column-md-10 bg-white shadow-sm p-4">
        <h5>
            PRODUCT LIST
        </h5>
        <div class="row mb-3">
            <div class="col-md-6">
                <select class="form-select category-list-select ">
                    <option value="choose category">Choose Category</option>
                </select>
            </div>
            <div class="col-md-6">
                <select class="form-select brand-list-select ">
                    <option value="choose brand">Choose Brand</option>
                </select>
            </div>
        </div>
        <div class="row">
            <div class="col-md-12 table-responsive">
                <table class="table">
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>Sr</th>
                                <th>Category</th>
                                <th>Brand</th>
                                <th>Name</th>
                                <th>Description</th>
                                <th>Prise</th>
                                <th>Quantity</th>
                                <th>Thumb</th>
                                <th>Front</th>
                                <th>Back</th>
                                <th>Right</th>
                                <th>Left</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody class="brand-list">                            
                        </tbody>
                    </table>
                </table>
            </div>
        </div>
    </div>
    <div class="column-md-1"></div>
</div>
