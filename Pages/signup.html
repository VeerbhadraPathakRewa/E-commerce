<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap link -->
    <link rel="stylesheet" href="../common/css/bootstrap.min.css">
    <script src="../common/js/bootstrap.bundle.min.js"></script>
    <!-- sweetalert link -->
    <script src="../common/js/sweetalert.min.js"></script>
    <!-- Animate link  -->
    <link rel="stylesheet" href="../common/css/animate.min.css">
    <!-- Fontawesome link  -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- link for custome CSS  -->

    <title>Privacy Policy</title>
</head>

<body>
    <!-- Navbar elements -->
    <div class="navbar-box">

    </div>

    <!-- Main page Elements  -->
    <div class="container bg-white p-4 shadow-lg  mb-4" style="margin-top: 70px;">
        <h3 class="text-center fw-bold mb-3"> Create An Account</h3>
        <hr>
        <div class="row">
            <div class="col-md-6">
                <form action="" class="signup-form">
                    <div class="input-group mb-3">
                        <span class="input-group-text">Fullname</span>
                        <input type="text" class="form-control">
                    </div>
                    <div class="input-group mb-3">
                        <span class="input-group-text">Email</span>
                        <input type="email" class="form-control">
                    </div>
                    <div class="input-group mb-3">
                        <span class="input-group-text">Pasword</span>
                        <input type="password" class="form-control">
                    </div>
                    <div class="input-group mb-3">
                        <span class="input-group-text">Mobile</span>
                        <input type="number" class="form-control">
                    </div>
                    <div class="input-group mb-3">
                        <span class="input-group-text">Address</span>
                        <textarea name="" id="" class="form-control"></textarea>
                    </div>
                    <div class="input-group mb-3">
                        <span class="input-group-text">State</span>
                        <input type="text" class="form-control">
                    </div>
                    <div class="input-group mb-3">
                        <span class="input-group-text">Contry</span>
                        <input type="text" class="form-control">
                    </div>
                    <div class="input-group mb-3">
                        <span class="input-group-text">PinCode</span>
                        <input type="number" class="form-control">
                    </div>
                    <button class="btn btn-primary float-end">Register Now</button>
                </form>

            </div>

            <div class="col-md-6 d-flex flex-column justify-content-center align-items-center">
                <h3 class="fw-bold">OLD CUSTOMER!</h3>
                <p>ALREADY HAVE AN ACCOUNT</p>
                <a href="http://localhost/e-commerce/Pages/login.html" class="btn-danger">Login Now</a>
            </div>
        </div>
    </div>
    <!-- Footer Elements -->

    <div class="footer-box">

    </div>

    <!-- custome script Coding -->
    <script src="../common/js/common.js"></script>
    <script src="../js/dynamic.js"></script>
    <script src="js/signup.js"></script>
    <script>
        const navbarBox = document.querySelector(".navbar-box")
        const footerBox = document.querySelector(".footer-box")
        dynamicRequest(navbarBox, "nav.html")
        dynamicRequest(footerBox, "footer.html")
    </script>
</body>

</html>
